project_id = "tindahub-marketplace"

[auth]
site_url = "https://tindahub-marketplace.vercel.app"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback", "https://tindahub-marketplace.vercel.app/auth/callback"]

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "{{ .Token }} is your JOM HUB verification code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "env(SUPABASE_AUTH_SMTP_USER)"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "env(SUPABASE_AUTH_SMTP_USER)"
sender_name = "JOM HUB"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false
